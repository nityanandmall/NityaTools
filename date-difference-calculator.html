<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Difference Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:white;text-decoration:none;font-weight:800}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:white;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>📅 Date Difference Calculator</h1><div class="grid"><div><label>Start Date</label><input id="a" type="date"></div><div><label>End Date</label><input id="b" type="date"></div></div><div class="result" id="r">Select two dates.</div></div></main><script>function c(){if(!a.value||!b.value)return;let x=new Date(a.value+'T00:00'),y=new Date(b.value+'T00:00'),days=Math.abs(Math.round((y-x)/86400000));r.textContent=`Difference: ${days.toLocaleString()} days • ${(days/7).toFixed(2)} weeks • ${(days/365.2425).toFixed(2)} years`}a.onchange=b.onchange=c</script></body></html>
