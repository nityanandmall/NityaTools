<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Govt Form Photo Resizer — NityaTools</title><meta name="description" content="Resize a photo to common government form photo dimensions directly in your browser."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#3567f0;color:#fff;font-weight:800}.preview{margin-top:18px;text-align:center}.preview canvas{max-width:100%;border:1px solid #dbe2ee;background:#fff}.note{color:#64748b;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>📸 Govt Form Photo Resizer</h1><div class="grid"><div><label>Select Photo</label><input id="file" type="file" accept="image/*"></div><div><label>Output Size</label><select id="size"><option value="200x230">200 × 230 px</option><option value="413x531">35 × 45 mm at 300 DPI</option><option value="300x300">300 × 300 px</option></select></div></div><button onclick="make()">Create Photo</button><div class="preview"><canvas id="cv" width="200" height="230"></canvas><br><button id="dl" style="display:none" onclick="downloadPhoto()">Download JPG</button></div><p class="note">This tool resizes and center-crops the image in your browser. Always check the exact dimensions, background and file-size rules of the form you are applying for.</p></div></main><script>let img=new Image();file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>img.src=r.result;r.readAsDataURL(f)};function make(){if(!img.src){alert('Please select a photo first.');return}let [w,h]=size.value.split('x').map(Number);cv.width=w;cv.height=h;let ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,w,h);let scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale,sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);dl.style.display='inline-block'}function downloadPhoto(){let a=document.createElement('a');a.download='nityatools-form-photo.jpg';a.href=cv.toDataURL('image/jpeg',.9);a.click()}</script></body></html>
