<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electrical Power Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>⚡ Electrical Power Calculator</h1><div class="grid"><div><label>Voltage (V)</label><input id="v" type="number" value="230"></div><div><label>Current (A)</label><input id="a" type="number" value="5"></div></div><div class="result" id="r"></div></div></main><script>function c(){let p=+v.value*+a.value;r.textContent=`Power: ${p.toFixed(2)} W • ${(p/1000).toFixed(3)} kW`}v.oninput=a.oninput=c;c()</script></body></html>
