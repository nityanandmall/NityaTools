<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 Encoder & Decoder Online — Encode or Decode Text</title><meta name="description" content="Free online Base64 encoder and decoder. Convert UTF-8 text to Base64 or decode valid Base64 back to readable text directly in your browser."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nitya-tools.vercel.app/base64-tool.html"><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:auto;padding:24px}.card,.info{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb;margin-bottom:18px}textarea{width:100%;min-height:180px;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:12px}.buttons{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}button{padding:11px 18px;border:0;border-radius:9px;background:#3567f0;color:#fff;font-weight:800}.info p{color:#64748b;font-size:13px;line-height:1.7}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🔐 Base64 Tool</h1><textarea id="input" aria-label="Text or Base64 input" placeholder="Text / Base64"></textarea><div class="buttons"><button id="encode">Encode</button><button id="decode">Decode</button></div><textarea id="out" aria-label="Base64 result" readonly placeholder="Result"></textarea></div><section class="info"><h2>How it works</h2><p>Base64 is an encoding method, not encryption. Text is encoded as UTF-8 before Base64 conversion.</p><p><a href="json-formatter.html">JSON Formatter</a> · <a href="url-encoder-decoder.html">URL Encoder / Decoder</a> · <a href="all-tools.html">All Tools</a></p></section></main><script src="nitya-i18n.js"></script><script>function tr(k,f=k){const L=localStorage.getItem('nt-language')||'English',d=window.NITYA_I18N_EXT?.[L]||{};return d[k]||f}function enc(){try{const bytes=new TextEncoder().encode(input.value);let s='';for(const b of bytes)s+=String.fromCharCode(b);out.value=btoa(s)}catch(e){out.value=tr('Please enter valid values.')}}function dec(){try{const raw=input.value.trim();const bytes=Uint8Array.from(atob(raw),c=>c.charCodeAt(0));out.value=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch(e){out.value=tr('Please enter valid values.')}}encode.onclick=enc;decode.onclick=dec;</script></body></html>
