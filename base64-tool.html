<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 Encoder Decoder — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}textarea{width:100%;min-height:180px;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:12px}.buttons{display:flex;gap:10px;margin:12px 0}button{padding:11px 18px;border:0;border-radius:9px;background:#3567f0;color:#fff;font-weight:800}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🔐 Base64 Encoder / Decoder</h1><textarea id="input" placeholder="Enter text or Base64..."></textarea><div class="buttons"><button onclick="enc()">Encode</button><button onclick="dec()">Decode</button></div><textarea id="out" readonly placeholder="Result..."></textarea></div></main><script>function enc(){try{out.value=btoa(unescape(encodeURIComponent(input.value)))}catch(e){out.value='Unable to encode input.'}}function dec(){try{out.value=decodeURIComponent(escape(atob(input.value.trim())))}catch(e){out.value='Invalid Base64 input.'}}</script></body></html>
