<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge PDF — NityaTools</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;padding:18px}header a{color:#fff;text-decoration:none;font-weight:800}.box{background:#fff;margin:28px 0;padding:22px;border:1px solid #e1e7ef;border-radius:18px}input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #cbd5e1}button{background:#3567f0;color:#fff;border:0;font-weight:800;cursor:pointer}.muted{color:#64748b;font-size:13px}</style></head><body><header><div class="w"><a href="pdf-tools.html">← PDF Tools</a></div></header><main class="w"><div class="box"><h1>Merge PDF</h1><p class="muted">Select two or more PDFs. They are combined in the order selected.</p><input id="files" type="file" accept="application/pdf" multiple><button id="go">Merge PDFs</button><div id="status" class="muted"></div><a id="down" style="display:none"><button>Download Merged PDF</button></a></div></main><script>go.onclick=async()=>{let fs=[...files.files];if(fs.length<2)return alert('Select at least two PDF files.');try{status.textContent='Processing...';let out=await PDFLib.PDFDocument.create();for(let f of fs){let src=await PDFLib.PDFDocument.load(await f.arrayBuffer());let pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p))}let bytes=await out.save(),blob=new Blob([bytes],{type:'application/pdf'}),u=URL.createObjectURL(blob);down.href=u;down.download='merged.pdf';down.style.display='block';status.textContent='Merged '+fs.length+' PDF files successfully.'}catch(e){status.textContent='Could not process this PDF. Encrypted or damaged PDFs may not be supported.'}}</script></body></html>
