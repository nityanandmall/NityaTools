<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPA Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:white;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:white;padding:24px;border:1px solid #e5e7eb;border-radius:18px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}.note{color:#64748b;font-size:13px}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🎓 GPA Calculator</h1><p class="note">Enter grade points on your institution's scale, separated by commas. This computes a simple unweighted average.</p><input id="v" value="4, 3.7, 3.3, 4"><div class="result" id="r"></div></div></main><script>function c(){let a=v.value.split(',').map(Number).filter(Number.isFinite);r.textContent=a.length?`Average GPA: ${(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2)}`:'Enter grade points'}v.oninput=c;c()</script></body></html>
