<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Resizer — NityaTools</title><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;padding:18px}header a{color:#fff;text-decoration:none;font-weight:800}.box{background:#fff;margin:28px 0;padding:22px;border:1px solid #e1e7ef;border-radius:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #cbd5e1}button{background:#3567f0;color:#fff;border:0;font-weight:800}.muted{color:#64748b;font-size:13px}img{max-width:100%;margin-top:12px}</style></head><body><header><div class="w"><a href="all-tools.html">← NITYA TOOLS</a></div></header><main class="w"><div class="box"><h1>Image Resizer</h1><p class="muted">Resize an image to exact pixel dimensions in your browser.</p><input id="file" type="file" accept="image/*"><div class="row"><input id="width" type="number" placeholder="Width px"><input id="height" type="number" placeholder="Height px"></div><button id="go">Resize Image</button><img id="preview"><a id="download" style="display:none"><button>Download Resized Image</button></a></div></main><script>let im=new Image(),f;file.onchange=()=>{f=file.files[0];if(!f)return;let u=URL.createObjectURL(f);im.onload=()=>{width.value=im.width;height.value=im.height;URL.revokeObjectURL(u)};im.src=u};go.onclick=()=>{if(!f)return alert('Choose an image first.');let w=+width.value,h=+height.value;if(w<1||h<1)return alert('Enter valid width and height.');let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>{let u=URL.createObjectURL(b);preview.src=u;download.href=u;download.download='resized-'+w+'x'+h+'.png';download.style.display='block'},'image/png')}</script></body></html>
