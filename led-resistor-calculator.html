<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED Resistor Calculator | NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#10203a}.w{max-width:850px;margin:auto;padding:24px}.top{background:#071327;color:#fff;padding:16px}.top a{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px;margin-top:24px;box-shadow:0 12px 30px #16315a12}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:13px;font-weight:700}input,button{width:100%;padding:12px;border:1px solid #d6deea;border-radius:10px;margin-top:6px}button{background:#3567f0;color:#fff;font-weight:800;border:0;cursor:pointer}.result{margin-top:18px;background:#eefbf0;border-radius:12px;padding:18px;font-size:18px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="w"><a href="index.html">← NITYA TOOLS</a></div></div><main class="w"><h1>💡 LED Resistor Calculator</h1><p>Find the nearest safe series resistor for a single LED.</p><div class="card"><div class="grid"><label>Supply Voltage (V)<input id="vs" type="number" step="0.1" value="5"></label><label>LED Forward Voltage (V)<input id="vf" type="number" step="0.1" value="2"></label><label>LED Current (mA)<input id="ma" type="number" step="1" value="20"></label></div><button onclick="calc()" style="margin-top:14px">Calculate Resistor</button><div id="out" class="result"></div></div></main><script>function calc(){const a=+vs.value,b=+vf.value,c=+ma.value;if(!(a>b&&c>0)){out.textContent='Please enter valid values.';return}const r=(a-b)/(c/1000),p=(a-b)*(c/1000);const std=Math.ceil(r/10)*10;out.textContent=`Required ≈ ${r.toFixed(0)} Ω • Use about ${std} Ω • Resistor power ≈ ${p.toFixed(3)} W`};calc()</script></body></html>
