<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPG PNG WebP Converter — NityaTools</title><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;padding:18px}header a{color:#fff;text-decoration:none;font-weight:800}.box{background:#fff;margin:28px 0;padding:22px;border:1px solid #e1e7ef;border-radius:18px}input,select,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #cbd5e1}button{background:#3567f0;color:#fff;border:0;font-weight:800}.muted{color:#64748b;font-size:13px}</style></head><body><header><div class="w"><a href="all-tools.html">← NITYA TOOLS</a></div></header><main class="w"><div class="box"><h1>JPG / PNG / WebP Converter</h1><p class="muted">Convert common image formats locally in your browser.</p><input id="file" type="file" accept="image/*"><select id="format"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select><button id="go">Convert Image</button><a id="download" style="display:none"><button>Download Converted Image</button></a></div></main><script>go.onclick=()=>{let f=file.files[0];if(!f)return alert('Choose an image first.');let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let x=c.getContext('2d');if(format.value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0);c.toBlob(b=>{let o=URL.createObjectURL(b),ext=format.value==='image/jpeg'?'jpg':format.value.split('/')[1];download.href=o;download.download='converted.'+ext;download.style.display='block';URL.revokeObjectURL(u)},format.value,.9)};im.src=u}</script></body></html>
