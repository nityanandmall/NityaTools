<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bigha Converter India — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:780px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800;line-height:1.8}.note{font-size:13px;color:#64748b}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🌾 Bigha Land Converter</h1><div class="grid"><div><label>Region Preset</label><select id="region"><option value="27000">Uttar Pradesh (approx. 27,000 sq ft)</option><option value="27220">Bihar (approx. 27,220 sq ft)</option><option value="14400">West Bengal (approx. 14,400 sq ft)</option><option value="17424">Assam (approx. 17,424 sq ft)</option></select></div><div><label>Bigha</label><input id="b" type="number" value="1" step="0.01"></div></div><div class="result" id="r"></div><p class="note">Bigha is not a uniform national unit and can vary by district/local custom. Always verify local land-record standards before legal use.</p></div></main><script>function c(){let sf=+b.value*+region.value,sm=sf*.09290304,acre=sf/43560;r.innerHTML=`Square feet: ${sf.toLocaleString(undefined,{maximumFractionDigits:2})}<br>Square meters: ${sm.toFixed(2)}<br>Acres: ${acre.toFixed(4)}`}b.oninput=region.onchange=c;c()</script></body></html>
