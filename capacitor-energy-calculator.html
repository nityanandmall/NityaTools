<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capacitor Energy Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🔋 Capacitor Energy Calculator</h1><p>Energy = ½ × C × V²</p><div class="grid"><input id="c" type="number" value="1000" placeholder="Capacitance µF"><input id="v" type="number" value="12" placeholder="Voltage V"></div><div class="result" id="r"></div></div></main><script>function x(){let e=.5*(+c.value/1e6)*Math.pow(+v.value,2);r.textContent=`Stored energy: ${e.toFixed(6)} joules`}c.oninput=v.oninput=x;x()</script></body></html>
