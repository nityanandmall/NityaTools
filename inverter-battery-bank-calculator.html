<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inverter Battery Bank Calculator | NityaTools</title><meta name="description" content="Estimate inverter battery bank Ah, series and parallel batteries required for your load and backup time."><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;color:#fff;padding:18px 0}.brand{font-weight:900}.brand b{color:#ffc72c}.card{background:#fff;margin:28px 0;padding:24px;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 8px 24px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #d1d5db;border-radius:9px;box-sizing:border-box}button{margin-top:18px;background:#3567f0;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800}.result{margin-top:18px;background:#eef4ff;padding:16px;border-radius:12px;line-height:1.7}.back{color:#3567f0;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="w brand">NITYA <b>TOOLS</b></div></header><main class="w"><div class="card"><a class="back" href="index.html">← Back to tools</a><h1>Inverter Battery Bank Calculator</h1><p>Estimate battery-bank size for a target backup time.</p><div class="grid"><label>Load (W)<input id="load" type="number" value="600"></label><label>Backup Time (hours)<input id="hrs" type="number" value="4" step="0.1"></label><label>System Voltage (V)<select id="sys"><option>12</option><option>24</option><option>48</option></select></label><label>Battery Voltage (V)<select id="bv"><option>12</option><option>6</option><option>2</option></select></label><label>Single Battery Capacity (Ah)<input id="bah" type="number" value="150"></label><label>Usable DoD (%)<input id="dod" type="number" value="50"></label><label>Inverter Efficiency (%)<input id="eff" type="number" value="85"></label></div><button onclick="calc()">Calculate</button><div class="result" id="r">Enter values and calculate.</div></div></main><script>function calc(){let L=+load.value,H=+hrs.value,S=+sys.value,BV=+bv.value,BA=+bah.value,D=+dod.value/100,E=+eff.value/100;if(!(L>0&&H>0&&S>0&&BV>0&&BA>0&&D>0&&D<=1&&E>0&&E<=1)){r.textContent='Please enter valid values.';return}if(S%BV!==0){r.innerHTML='Battery voltage must divide evenly into system voltage.';return}let requiredWh=L*H/E,nominalWh=requiredWh/D,bankAh=nominalWh/S,series=S/BV,parallel=Math.ceil(bankAh/BA),total=series*parallel;r.innerHTML='<b>Required Bank Capacity:</b> '+bankAh.toFixed(1)+' Ah at '+S+' V<br><b>Series Batteries:</b> '+series+'<br><b>Parallel Strings:</b> '+parallel+'<br><b>Total Batteries:</b> '+total+' × '+BV+'V '+BA+'Ah<br><b>Nominal Stored Energy:</b> '+(nominalWh/1000).toFixed(2)+' kWh';}</script></body></html>
