<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Converter — NityaTools</title><meta name="description" content="Convert decimal, binary, octal and hexadecimal numbers instantly."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.wrap{max-width:820px;margin:auto;padding:24px}.top{background:#071327;color:#fff;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px}.row{display:grid;grid-template-columns:180px 1fr;gap:12px;margin:12px 0;align-items:center}label{font-weight:700}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:#3567f0;color:#fff;font-weight:800}.note{font-size:13px;color:#64748b}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>💻 Binary / Decimal / Hex Converter</h1><p class="note">Enter a value in any one field, then convert it to the other number systems.</p><div class="row"><label>Decimal</label><input id="dec" placeholder="e.g. 255"></div><div class="row"><label>Binary</label><input id="bin" placeholder="e.g. 11111111"></div><div class="row"><label>Octal</label><input id="oct" placeholder="e.g. 377"></div><div class="row"><label>Hexadecimal</label><input id="hex" placeholder="e.g. FF"></div><button onclick="convert()">Convert</button></div></main><script>function convert(){const d=document.getElementById('dec'),b=document.getElementById('bin'),o=document.getElementById('oct'),h=document.getElementById('hex');let n=null;if(d.value.trim()!=='')n=parseInt(d.value,10);else if(b.value.trim()!=='')n=parseInt(b.value,2);else if(o.value.trim()!=='')n=parseInt(o.value,8);else if(h.value.trim()!=='')n=parseInt(h.value,16);if(!Number.isFinite(n)||n<0){alert('Please enter a valid non-negative number.');return}d.value=n.toString(10);b.value=n.toString(2);o.value=n.toString(8);h.value=n.toString(16).toUpperCase()}</script></body></html>
