<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Series Parallel Resistor Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>〰️ Series / Parallel Resistor Calculator</h1><p>Enter resistor values in ohms separated by commas.</p><input id="vals" value="100, 220, 330"><div class="result" id="r"></div></div></main><script>function c(){let a=vals.value.split(',').map(Number).filter(x=>x>0),s=a.reduce((x,y)=>x+y,0),p=a.length?1/a.reduce((x,y)=>x+1/y,0):0;r.textContent=`Series: ${s.toFixed(3)} Ω • Parallel: ${p.toFixed(3)} Ω`}vals.oninput=c;c()</script></body></html>
