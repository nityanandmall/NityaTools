<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix Timestamp Converter — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:780px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 14px}.result{background:#eef4ff;padding:16px;border-radius:12px;font-weight:700}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>⏱️ Unix Timestamp Converter</h1><label>Unix timestamp (seconds)</label><input id="ts" type="number"><div class="result" id="date"></div><h3>Date/Time to timestamp</h3><input id="dt" type="datetime-local"><div class="result" id="unix"></div></div></main><script>ts.value=Math.floor(Date.now()/1000);function a(){let d=new Date(+ts.value*1000);date.textContent=isNaN(d)?'Invalid timestamp':d.toString()}function b(){let d=new Date(dt.value);unix.textContent=dt.value?`Unix: ${Math.floor(d.getTime()/1000)}`:'Select date and time'}ts.oninput=a;dt.oninput=b;a()</script></body></html>
