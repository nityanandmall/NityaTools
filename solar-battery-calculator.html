<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Battery Calculator | NityaTools</title><meta name="description" content="Estimate solar battery storage capacity in Ah and kWh from daily energy use and backup days."><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;color:#fff;padding:18px 0}.brand{font-weight:900}.brand b{color:#ffc72c}.card{background:#fff;margin:28px 0;padding:24px;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 8px 24px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #d1d5db;border-radius:9px;box-sizing:border-box}button{margin-top:18px;background:#3567f0;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800}.result{margin-top:18px;background:#eef4ff;padding:16px;border-radius:12px;line-height:1.7}.back{color:#3567f0;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="w brand">NITYA <b>TOOLS</b></div></header><main class="w"><div class="card"><a class="back" href="index.html">← Back to tools</a><h1>Solar Battery Calculator</h1><p>Estimate battery storage for off-grid or backup solar systems.</p><div class="grid"><label>Daily Energy Use (Wh)<input id="wh" type="number" value="3000"></label><label>Backup / Autonomy Days<input id="days" type="number" value="1" step="0.1"></label><label>Battery Bank Voltage (V)<select id="v"><option>12</option><option>24</option><option>48</option></select></label><label>Usable DoD (%)<input id="dod" type="number" value="80"></label><label>System Efficiency (%)<input id="eff" type="number" value="90"></label></div><button onclick="calc()">Calculate</button><div class="result" id="r">Enter values and calculate.</div></div></main><script>function calc(){let W=+wh.value,DY=+days.value,V=+v.value,D=+dod.value/100,E=+eff.value/100;if(!(W>0&&DY>0&&V>0&&D>0&&D<=1&&E>0&&E<=1)){r.textContent='Please enter valid values.';return}let loadEnergy=W*DY,nominalWh=loadEnergy/(D*E),Ah=nominalWh/V;r.innerHTML='<b>Recommended Battery Bank:</b> '+Ah.toFixed(1)+' Ah at '+V+' V<br><b>Nominal Storage:</b> '+(nominalWh/1000).toFixed(2)+' kWh<br><b>Usable Energy Target:</b> '+(loadEnergy/1000).toFixed(2)+' kWh<br><small>Real installations should also consider temperature, battery ageing and manufacturer limits.</small>';}</script></body></html>
