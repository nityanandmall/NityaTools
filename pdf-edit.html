<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit PDF Online — Add Text to PDF | NityaTools</title><meta name="description" content="Free browser-based PDF editor to add text to PDF pages and download the edited PDF."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nitya-tools.vercel.app/pdf-edit.html"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.top{background:#071327}.w{width:min(950px,calc(100% - 28px));margin:auto}.nav{min-height:62px;display:flex;align-items:center;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:22px;margin:28px 0}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}label{font-size:13px;font-weight:700}input,select,button{width:100%;padding:12px;border:1px solid #d7deea;border-radius:9px}button{background:#3567f0;color:#fff;border:0;font-weight:800;cursor:pointer}.note{font-size:13px;color:#64748b;line-height:1.6}.status{margin-top:12px;font-size:13px;font-weight:700}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="w nav"><a href="index.html">NITYA TOOLS</a><a href="pdf-tools.html">← PDF Tools</a></div></header><main class="w"><div class="panel"><h1>✏️ Edit PDF</h1><p class="note">Choose a PDF, add text to any page, set its position and size, then download the edited PDF. Processing happens in your browser.</p><label>Select PDF</label><input id="file" type="file" accept="application/pdf"><div class="row"><div><label>Page number</label><input id="page" type="number" min="1" value="1"></div><div><label>Text size</label><input id="size" type="number" min="6" max="100" value="18"></div></div><label>Text to add</label><input id="text" type="text" placeholder="Enter text"><div class="row"><div><label>X position</label><input id="x" type="number" min="0" value="50"></div><div><label>Y position (from bottom)</label><input id="y" type="number" min="0" value="50"></div></div><button id="edit">Edit & Download PDF</button><div id="status" class="status"></div><p class="note">This first editor supports adding text to existing PDF pages. Keep a copy of the original PDF before editing.</p></div></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>edit.onclick=async()=>{const f=file.files[0];if(!f){status.textContent='Please select a PDF.';return}try{status.textContent='Editing PDF…';const bytes=await f.arrayBuffer(),doc=await PDFLib.PDFDocument.load(bytes),n=Math.max(1,parseInt(page.value||1));if(n>doc.getPageCount())throw new Error('Page number is too high.');const p=doc.getPage(n-1),font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);p.drawText(text.value||'',{x:+x.value||0,y:+y.value||0,size:+size.value||18,font});const out=await doc.save(),blob=new Blob([out],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edited-'+f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='Done. Edited PDF downloaded.'}catch(e){status.textContent='Could not edit PDF: '+e.message}};</script><script src="nitya-i18n.js" defer></script></body></html>
