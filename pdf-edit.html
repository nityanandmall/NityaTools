<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit PDF Online — Text, Images, Draw, Sign & Annotate | NityaTools</title><meta name="description" content="Free browser PDF editor with visual page preview. Add text, images, signatures, drawings, highlights, shapes and whiteout, then download the edited PDF."><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#eef2f7;color:#111827}.top{background:#071327}.nav{width:min(1400px,calc(100% - 24px));margin:auto;min-height:58px;display:flex;align-items:center;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.app{width:min(1400px,calc(100% - 20px));margin:16px auto}.upload,.toolbar,.side{background:#fff;border:1px solid #dfe6ef;border-radius:14px}.upload{padding:16px;margin-bottom:12px}.upload h1{margin:0 0 6px}.muted{color:#64748b;font-size:13px}.fileRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fileRow input{flex:1;min-width:250px}.loadStatus{margin-top:9px;font-size:13px;font-weight:800;color:#334155}.toolbar{padding:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:20}.toolbar button,.toolbar select,.toolbar input{height:38px;border:1px solid #d5deea;background:#fff;border-radius:8px;padding:0 10px;font-weight:700}.toolbar button{cursor:pointer}.toolbar button.active{background:#3567f0;color:#fff}.toolbar .primary{background:#16a34a;color:#fff;border-color:#16a34a}.danger{color:#b91c1c}.work{display:grid;grid-template-columns:180px 1fr;gap:12px;margin-top:12px}.side{padding:10px;max-height:calc(100vh - 150px);overflow:auto}.thumb{border:2px solid transparent;border-radius:8px;padding:5px;margin-bottom:8px;cursor:pointer;background:#f8fafc;text-align:center;font-size:11px}.thumb.active{border-color:#3567f0;background:#eef4ff}.thumb canvas{max-width:100%;height:auto}.editorPane{background:#cbd5e1;border-radius:14px;min-height:70vh;overflow:auto;padding:22px;text-align:center}.stage{position:relative;display:inline-block;background:#fff;box-shadow:0 8px 30px #0003;line-height:0}.stage>canvas{display:block}.canvas-container{position:absolute!important;left:0!important;top:0!important}.hidden{display:none!important}.status{font-size:12px;font-weight:700;color:#334155;margin-left:auto}.tip{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px;margin-top:10px;font-size:12px;color:#92400e}@media(max-width:850px){.work{grid-template-columns:1fr}.side{display:flex;gap:8px;max-height:none;overflow:auto}.thumb{min-width:110px}.toolbar{position:static}.editorPane{padding:8px}}</style></head><body><header class="top"><div class="nav"><a href="index.html">NITYA TOOLS</a><a href="pdf-tools.html">← PDF Tools</a></div></header><main class="app"><section class="upload"><h1>✏️ Edit PDF</h1><p class="muted">Choose a PDF. It opens automatically for visual editing in your browser.</p><div class="fileRow"><input id="fileInput" type="file" accept="application/pdf"><button id="openBtn">Open PDF</button></div><div id="loadStatus" class="loadStatus">Editor ready. Choose a PDF.</div><div class="tip">For existing text, use Whiteout over the old text and then add new text.</div></section><section id="toolbar" class="toolbar hidden"><button data-tool="select" class="active">↖ Select</button><button data-tool="text">T Text</button><button data-tool="draw">✍ Draw</button><button data-tool="highlight">🖍 Highlight</button><button data-tool="whiteout">⬜ Whiteout</button><button data-tool="rect">▭ Shape</button><button id="imageBtn">🖼 Image</button><button id="signBtn">✒ Sign</button><input id="imageInput" type="file" accept="image/*" class="hidden"><input id="signInput" type="file" accept="image/*" class="hidden"><select id="fontFamily"><option>Arial</option><option>Helvetica</option><option>Times New Roman</option><option>Courier New</option></select><input id="fontSize" type="number" min="8" max="96" value="22" style="width:70px"><input id="color" type="color" value="#111111" style="width:48px"><button id="boldBtn"><b>B</b></button><button id="italicBtn"><i>I</i></button><button id="deleteObj" class="danger">🗑 Delete item</button><button id="clearPage" class="danger">Clear page edits</button><button id="prevPage">←</button><span id="pageLabel">1 / 1</span><button id="nextPage">→</button><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button><button id="rotatePage">↻ Rotate</button><button id="deletePage" class="danger">Delete page</button><button id="downloadBtn" class="primary">✓ Apply & Download</button><span id="status" class="status"></span></section><section id="work" class="work hidden"><aside id="thumbs" class="side"></aside><div class="editorPane"><div id="stage" class="stage"><canvas id="pdfCanvas"></canvas><canvas id="overlayCanvas"></canvas></div></div></section></main><script>
const $=id=>document.getElementById(id);let libsReady=false,bytes,pdfjsDoc,currentPage=1,zoom=1.15,fcanvas=null,tool='select',pageStates={},deletedPages=new Set(),pageRotations={};
function loadScript(url){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function ensureLibs(){if(libsReady)return;const ls=$('loadStatus');ls.textContent='Loading editor libraries…';if(!window.pdfjsLib){try{await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js')}catch{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')}}if(!window.PDFLib){try{await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js')}catch{await loadScript('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js')}}if(!window.fabric){try{await loadScript('https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js')}catch{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js')}}if(!window.pdfjsLib||!window.PDFLib||!window.fabric)throw new Error('Editor libraries could not load.');libsReady=true;ls.textContent='Editor ready. Choose a PDF.'}
const toolBtns=()=>[...document.querySelectorAll('[data-tool]')];function status(t){$('status').textContent=t||'';$('loadStatus').textContent=t||'Editor ready.'}function setTool(t){tool=t;toolBtns().forEach(b=>b.classList.toggle('active',b.dataset.tool===t));if(!fcanvas)return;fcanvas.isDrawingMode=t==='draw';fcanvas.selection=t==='select';fcanvas.forEachObject(o=>{o.selectable=t==='select';o.evented=t==='select'});if(t==='draw'){fcanvas.freeDrawingBrush.color=$('color').value;fcanvas.freeDrawingBrush.width=3}fcanvas.requestRenderAll()}function saveState(){if(fcanvas)pageStates[currentPage]=fcanvas.toJSON(['name'])}async function restoreState(){fcanvas.clear();if(pageStates[currentPage])await new Promise(r=>fcanvas.loadFromJSON(pageStates[currentPage],()=>{fcanvas.renderAll();r()}));setTool(tool)}
async function renderPage(){saveState();status('Loading page…');const pg=await pdfjsDoc.getPage(currentPage),vp=pg.getViewport({scale:zoom,rotation:(pg.rotate+(pageRotations[currentPage]||0))%360}),pc=$('pdfCanvas');pc.width=vp.width;pc.height=vp.height;await pg.render({canvasContext:pc.getContext('2d'),viewport:vp}).promise;$('stage').style.width=vp.width+'px';$('stage').style.height=vp.height+'px';if(fcanvas)fcanvas.dispose();fcanvas=new fabric.Canvas('overlayCanvas',{width:vp.width,height:vp.height,preserveObjectStacking:true});fcanvas.on('mouse:down',canvasDown);fcanvas.on('object:modified',saveState);fcanvas.on('object:added',saveState);fcanvas.on('object:removed',saveState);await restoreState();$('pageLabel').textContent=currentPage+' / '+pdfjsDoc.numPages;$('zoomLabel').textContent=Math.round(zoom/1.15*100)+'%';document.querySelectorAll('.thumb').forEach(x=>x.classList.toggle('active',+x.dataset.page===currentPage));status('Ready')}
function canvasDown(opt){if(!fcanvas||tool==='select'||tool==='draw')return;const p=fcanvas.getPointer(opt.e),c=$('color').value;let o;if(tool==='text')o=new fabric.IText('Type here',{left:p.x,top:p.y,fontSize:+$('fontSize').value||22,fontFamily:$('fontFamily').value,fill:c,fontWeight:$('boldBtn').classList.contains('active')?'bold':'normal',fontStyle:$('italicBtn').classList.contains('active')?'italic':'normal'});if(tool==='highlight')o=new fabric.Rect({left:p.x,top:p.y,width:180,height:24,fill:'rgba(255,235,59,.45)'});if(tool==='whiteout')o=new fabric.Rect({left:p.x,top:p.y,width:180,height:30,fill:'#fff'});if(tool==='rect')o=new fabric.Rect({left:p.x,top:p.y,width:160,height:80,fill:'transparent',stroke:c,strokeWidth:3});if(o){fcanvas.add(o).setActiveObject(o);if(tool==='text'){o.enterEditing();o.selectAll()}setTool('select')}}
async function addImage(file,name){if(!file||!fcanvas)return;const url=URL.createObjectURL(file);fabric.Image.fromURL(url,img=>{const s=Math.min(1,250/img.width);img.set({left:60,top:60,scaleX:s,scaleY:s,name});fcanvas.add(img).setActiveObject(img);fcanvas.renderAll();URL.revokeObjectURL(url)})}
async function buildThumbs(){const box=$('thumbs');box.innerHTML='';for(let i=1;i<=pdfjsDoc.numPages;i++){const d=document.createElement('div');d.className='thumb';d.dataset.page=i;d.innerHTML='<div>Page '+i+'</div>';d.onclick=async()=>{saveState();currentPage=i;await renderPage()};box.appendChild(d);setTimeout(async()=>{try{const p=await pdfjsDoc.getPage(i),vp=p.getViewport({scale:.18}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;d.prepend(cv);await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise}catch{}},i*30)}}
async function openPdf(){const f=$('fileInput').files[0];if(!f)return alert('Please choose a PDF first.');try{$('openBtn').disabled=true;status('Preparing editor…');await ensureLibs();status('Opening PDF…');bytes=new Uint8Array(await f.arrayBuffer());pdfjsDoc=await pdfjsLib.getDocument({data:bytes.slice(),disableWorker:true}).promise;currentPage=1;pageStates={};deletedPages.clear();pageRotations={};$('toolbar').classList.remove('hidden');$('work').classList.remove('hidden');await renderPage();buildThumbs()}catch(e){console.error(e);status('Could not open PDF: '+(e.message||e));alert('Could not open PDF. '+(e.message||e))}finally{$('openBtn').disabled=false}}
async function exportPdf(){if(!bytes)return;try{saveState();status('Applying changes…');const doc=await PDFLib.PDFDocument.load(bytes.slice());for(let p=1;p<=pdfjsDoc.numPages;p++){if(deletedPages.has(p))continue;const state=pageStates[p],rot=pageRotations[p]||0,pg=doc.getPage(p-1);if(rot)pg.setRotation(PDFLib.degrees((pg.getRotation().angle+rot)%360));if(!state?.objects?.length)continue;const jsp=await pdfjsDoc.getPage(p),vp=jsp.getViewport({scale:1.15,rotation:(jsp.rotate+rot)%360}),temp=document.createElement('canvas');temp.width=vp.width;temp.height=vp.height;const fc=new fabric.StaticCanvas(temp,{width:vp.width,height:vp.height});await new Promise(r=>fc.loadFromJSON(state,()=>{fc.renderAll();r()}));const png=await doc.embedPng(temp.toDataURL('image/png'));pg.drawImage(png,{x:0,y:0,width:pg.getWidth(),height:pg.getHeight()});fc.dispose()}[...deletedPages].sort((a,b)=>b-a).forEach(p=>doc.removePage(p-1));const out=await doc.save(),blob=new Blob([out],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edited-'+($('fileInput').files[0]?.name||'document.pdf');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);status('Done ✓')}catch(e){status('Save failed: '+e.message);alert(e.message)}}
$('fileInput').addEventListener('change',openPdf);$('openBtn').onclick=openPdf;toolBtns().forEach(b=>b.onclick=()=>setTool(b.dataset.tool));$('imageBtn').onclick=()=>$('imageInput').click();$('signBtn').onclick=()=>$('signInput').click();$('imageInput').onchange=e=>addImage(e.target.files[0],'image');$('signInput').onchange=e=>addImage(e.target.files[0],'signature');$('deleteObj').onclick=()=>{const o=fcanvas?.getActiveObject();if(o){fcanvas.remove(o);fcanvas.discardActiveObject();fcanvas.renderAll()}};$('clearPage').onclick=()=>{if(confirm('Clear all edits from this page?')){fcanvas.clear();pageStates[currentPage]=null;renderPage()}};$('prevPage').onclick=async()=>{if(currentPage>1){saveState();currentPage--;await renderPage()}};$('nextPage').onclick=async()=>{if(currentPage<pdfjsDoc.numPages){saveState();currentPage++;await renderPage()}};$('zoomIn').onclick=async()=>{zoom=Math.min(2.2,zoom+.15);await renderPage()};$('zoomOut').onclick=async()=>{zoom=Math.max(.55,zoom-.15);await renderPage()};$('rotatePage').onclick=async()=>{pageRotations[currentPage]=((pageRotations[currentPage]||0)+90)%360;await renderPage()};$('deletePage').onclick=()=>{if(pdfjsDoc.numPages-deletedPages.size<=1)return alert('At least one page must remain.');deletedPages.has(currentPage)?deletedPages.delete(currentPage):deletedPages.add(currentPage);status(deletedPages.has(currentPage)?'Page marked for deletion':'Page restored')};$('downloadBtn').onclick=exportPdf;$('boldBtn').onclick=function(){this.classList.toggle('active')};$('italicBtn').onclick=function(){this.classList.toggle('active')};$('color').onchange=()=>{if(fcanvas?.isDrawingMode)fcanvas.freeDrawingBrush.color=$('color').value};document.addEventListener('keydown',e=>{if(e.key==='Delete'&&fcanvas?.getActiveObject())$('deleteObj').click()});ensureLibs().catch(e=>{$('loadStatus').textContent='Editor libraries will load when you choose a PDF.';console.warn(e)});
</script></body></html>
