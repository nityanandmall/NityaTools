<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marks Percentage Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:700px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🎓 Marks Percentage Calculator</h1><div class="grid"><input id="got" type="number" value="425" placeholder="Marks obtained"><input id="total" type="number" value="500" placeholder="Total marks"></div><div class="result" id="r"></div></div></main><script>function c(){r.textContent=+total.value>0?`Percentage: ${(+got.value/+total.value*100).toFixed(2)}%`:'Enter total marks'}got.oninput=total.oninput=c;c()</script></body></html>
