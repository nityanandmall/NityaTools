<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery Backup Calculator — NityaTools</title><meta name="description" content="Estimate battery backup time from voltage, amp-hours, load, efficiency and usable capacity."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.wrap{max-width:820px;margin:auto;padding:24px}.top{background:#071327;color:#fff;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 10px 30px #0f172a0d}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#3567f0;color:white;font-weight:800}.result{margin-top:18px;background:#eef4ff;border-radius:12px;padding:18px;font-size:18px;font-weight:700}.note{color:#64748b;font-size:13px;line-height:1.6}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🔋 Battery Backup Calculator</h1><p class="note">Enter your battery and load details. Result is an estimate; real backup can vary with battery health, temperature, inverter losses and load type.</p><div class="grid"><div><label>Battery Voltage (V)</label><input id="v" type="number" value="12" min="1"></div><div><label>Battery Capacity (Ah)</label><input id="ah" type="number" value="150" min="1"></div><div><label>Load (W)</label><input id="load" type="number" value="600" min="1"></div><div><label>Efficiency (%)</label><input id="eff" type="number" value="85" min="1" max="100"></div><div><label>Usable Capacity (%)</label><input id="usable" type="number" value="80" min="1" max="100"></div></div><button onclick="calc()">Calculate Backup Time</button><div class="result" id="result">Estimated backup: —</div><p class="note">Formula: Backup hours ≈ (Voltage × Ah × Efficiency × Usable Capacity) ÷ Load.</p></div></main><script>function calc(){const v=+document.getElementById('v').value,ah=+document.getElementById('ah').value,l=+document.getElementById('load').value,e=+document.getElementById('eff').value/100,u=+document.getElementById('usable').value/100;const r=document.getElementById('result');if(v<=0||ah<=0||l<=0||e<=0||u<=0){r.textContent='Please enter valid values.';return}const h=v*ah*e*u/l;const hrs=Math.floor(h),mins=Math.round((h-hrs)*60);r.textContent=`Estimated backup: ${h.toFixed(2)} hours (${hrs} hr ${mins} min)`}</script></body></html>
