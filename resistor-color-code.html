<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resistor Color Code Calculator | NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#10203a}.w{max-width:850px;margin:auto;padding:24px}.top{background:#071327;color:#fff;padding:16px}.top a{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px;margin-top:24px;box-shadow:0 12px 30px #16315a12}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}select,input,button{width:100%;padding:12px;border:1px solid #d6deea;border-radius:10px}button{background:#3567f0;color:#fff;font-weight:800;border:0;cursor:pointer}.result{margin-top:18px;background:#eef4ff;border-radius:12px;padding:18px;font-size:20px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><div class="w"><a href="index.html">← NITYA TOOLS</a></div></div><main class="w"><h1>🎨 Resistor Color Code Calculator</h1><p>Select a standard 4-band resistor color code.</p><div class="card"><div class="grid"><select id="b1"></select><select id="b2"></select><select id="mul"></select><select id="tol"><option value="5">Gold ±5%</option><option value="10">Silver ±10%</option><option value="1">Brown ±1%</option><option value="2">Red ±2%</option></select></div><button onclick="calc()" style="margin-top:14px">Calculate Resistance</button><div id="out" class="result">Select colors and calculate.</div></div></main><script>const d=[['Black',0],['Brown',1],['Red',2],['Orange',3],['Yellow',4],['Green',5],['Blue',6],['Violet',7],['Gray',8],['White',9]];for(const id of ['b1','b2']){const s=document.getElementById(id);d.forEach(x=>s.add(new Option(x[0],x[1])))}const m=document.getElementById('mul');d.slice(0,8).forEach(x=>m.add(new Option(x[0]+' ×10^'+x[1],x[1])));b1.value=1;b2.value=0;mul.value=2;function fmt(v){if(v>=1e6)return(v/1e6).toFixed(2)+' MΩ';if(v>=1e3)return(v/1e3).toFixed(2)+' kΩ';return v+' Ω'}function calc(){const v=(+b1.value*10 + +b2.value)*10**(+mul.value);out.textContent=fmt(v)+'  ±'+tol.value+'%'}calc()</script></body></html>
