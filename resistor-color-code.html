<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4-Band Resistor Color Code Calculator — Ohms & Tolerance</title><meta name="description" content="Calculate a standard 4-band resistor value and tolerance from color bands with this free resistor color code calculator."><meta name="robots" content="index,follow"><link rel="canonical" href="https://nitya-tools.vercel.app/resistor-color-code.html"><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f6f8fc;color:#10203a}.top,footer{background:#071327}.nav{max-width:900px;margin:auto;min-height:62px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.links{display:flex;gap:16px}.links a{font-size:13px;color:#dbe4f3}.w{max-width:850px;margin:auto;padding:24px}.card,.info{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}select,button{width:100%;padding:12px;border:1px solid #d6deea;border-radius:10px}button{background:#3567f0;color:#fff;font-weight:800;border:0;cursor:pointer}.result{margin-top:18px;background:#eef4ff;border-radius:12px;padding:18px;font-size:20px;font-weight:800}.info p{font-size:13px;color:#64748b;line-height:1.7}footer{text-align:center;padding:22px}footer a{color:#cbd5e1;text-decoration:none;font-size:12px;margin:0 6px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.links a:first-child{display:none}}</style></head><body><header class="top"><div class="nav"><a href="index.html">NITYA TOOLS</a><div class="links"><a href="index.html">Home</a><a href="all-tools.html">All Tools</a><a href="categories.html">Categories</a></div></div></header><main class="w"><h1>🎨 Resistor Color Code</h1><div class="card"><div class="grid"><select id="b1" aria-label="1"></select><select id="b2" aria-label="2"></select><select id="mul" aria-label="3"></select><select id="tol" aria-label="4"><option value="5">±5%</option><option value="10">±10%</option><option value="1">±1%</option><option value="2">±2%</option></select></div><button id="go" style="margin-top:14px">Calculate</button><div id="out" class="result" aria-live="polite">—</div></div><section class="info"><h2>Formula</h2><p>R = (digit 1, digit 2) × 10^multiplier</p><p><a href="series-parallel-resistor-calculator.html">Series / Parallel Resistor Calculator</a> · <a href="ohms-law-calculator.html">Ohm's Law</a> · <a href="all-tools.html">All Tools</a></p></section></main><footer><a href="about.html">About</a><a href="privacy-policy.html">Privacy</a><a href="terms.html">Terms</a><a href="contact.html">Contact</a></footer><script src="nitya-i18n.js"></script><script>for(const id of ['b1','b2']){const s=document.getElementById(id);for(let n=0;n<=9;n++)s.add(new Option(String(n),String(n)))}for(let n=0;n<=7;n++)mul.add(new Option('×10^'+n,String(n)));b1.value='1';b2.value='0';mul.value='2';function fmt(v){if(v>=1e6)return(v/1e6).toFixed(2)+' MΩ';if(v>=1e3)return(v/1e3).toFixed(2)+' kΩ';return v+' Ω'}function calc(){const v=(+b1.value*10 + +b2.value)*10**(+mul.value);out.textContent=fmt(v)+' ±'+tol.value+'%'}go.onclick=calc;[b1,b2,mul,tol].forEach(x=>x.onchange=calc);calc();</script></body></html>
