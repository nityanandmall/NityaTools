<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rotate PDF — NityaTools</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;padding:18px}header a{color:#fff;text-decoration:none;font-weight:800}.box{background:#fff;margin:28px 0;padding:22px;border:1px solid #e1e7ef;border-radius:18px}input,select,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #cbd5e1}button{background:#3567f0;color:#fff;border:0;font-weight:800}.muted{color:#64748b;font-size:13px}</style></head><body><header><div class="w"><a href="pdf-tools.html">← PDF Tools</a></div></header><main class="w"><div class="box"><h1>Rotate PDF</h1><p class="muted">Rotate all pages clockwise and download a new PDF.</p><input id="file" type="file" accept="application/pdf"><select id="angle"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">270° clockwise</option></select><button id="go">Rotate PDF</button><div id="status" class="muted"></div><a id="down" style="display:none"><button>Download Rotated PDF</button></a></div></main><script>go.onclick=async()=>{let f=file.files[0];if(!f)return alert('Choose a PDF.');try{let d=await PDFLib.PDFDocument.load(await f.arrayBuffer()),a=+angle.value;d.getPages().forEach(p=>{let old=p.getRotation().angle||0;p.setRotation(PDFLib.degrees((old+a)%360))});let b=new Blob([await d.save()],{type:'application/pdf'}),u=URL.createObjectURL(b);down.href=u;down.download='rotated.pdf';down.style.display='block';status.textContent=d.getPageCount()+' page(s) rotated.'}catch(e){status.textContent='Could not process this PDF.'}}</script></body></html>
