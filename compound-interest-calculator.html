<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compound Interest Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:13px;font-weight:700}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>💰 Compound Interest Calculator</h1><div class="grid"><div><label>Principal</label><input id="p" type="number" value="10000"></div><div><label>Annual Rate (%)</label><input id="rate" type="number" value="8"></div><div><label>Years</label><input id="years" type="number" value="5"></div><div><label>Compounds per Year</label><select id="freq"><option value="1">Yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select></div></div><div class="result" id="r"></div></div></main><script>function c(){let P=+p.value,R=+rate.value/100,T=+years.value,N=+freq.value,A=P*Math.pow(1+R/N,N*T);r.textContent=`Future value: ${A.toFixed(2)} • Interest earned: ${(A-P).toFixed(2)}`}document.querySelectorAll('input,select').forEach(e=>e.oninput=c);c()</script></body></html>
