<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electricity Bill Calculator India — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800;line-height:1.8}.note{font-size:13px;color:#64748b}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>💡 Electricity Bill Estimator</h1><div class="grid"><div><label>Units Consumed (kWh)</label><input id="units" type="number" value="200" min="0"></div><div><label>Rate per Unit</label><input id="rate" type="number" value="7" min="0" step="0.01"></div><div><label>Fixed Charge</label><input id="fixed" type="number" value="100" min="0" step="0.01"></div><div><label>Other Tax/Charge (%)</label><input id="tax" type="number" value="0" min="0" step="0.01"></div></div><div class="result" id="r"></div><p class="note">Electricity tariffs differ by state, DISCOM, connection type and slab. Enter the tariff from your bill for a closer estimate.</p></div></main><script>function c(){let u=+units.value,rt=+rate.value,f=+fixed.value,t=+tax.value/100,energy=u*rt,sub=energy+f,total=sub*(1+t);r.innerHTML=`Energy charge: ${energy.toFixed(2)}<br>Fixed charge: ${f.toFixed(2)}<br>Other charges: ${(sub*t).toFixed(2)}<br>Estimated bill: ${total.toFixed(2)}`}document.querySelectorAll('input').forEach(e=>e.oninput=c);c()</script></body></html>
