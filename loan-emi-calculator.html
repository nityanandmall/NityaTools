<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Payment Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🏦 Loan Payment Calculator</h1><div class="grid"><div><label>Loan Amount</label><input id="p" type="number" value="100000"></div><div><label>Annual Rate (%)</label><input id="rate" type="number" value="8"></div><div><label>Term (Years)</label><input id="years" type="number" value="5"></div></div><div class="result" id="r"></div></div></main><script>function c(){let P=+p.value,n=+years.value*12,i=+rate.value/1200,m=i?P*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):P/n,total=m*n;r.textContent=`Monthly payment: ${m.toFixed(2)} • Total interest: ${(total-P).toFixed(2)} • Total paid: ${total.toFixed(2)}`}document.querySelectorAll('input').forEach(e=>e.oninput=c);c()</script></body></html>
