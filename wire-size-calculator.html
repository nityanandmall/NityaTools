<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DC Wire Size Calculator | NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f7f9fc;color:#111827}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 8px 24px #0f172a0d}h1{font-size:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:13px}input{width:100%;padding:12px;border:1px solid #cfd7e3;border-radius:10px;margin-top:6px;box-sizing:border-box}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#3567f0;color:white;font-weight:800}.result{margin-top:18px;padding:16px;border-radius:12px;background:#eef4ff}.back{display:inline-block;margin-bottom:15px;text-decoration:none;color:#3567f0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="index.html">← Back to NityaTools</a><div class="card"><h1>🔌 DC Wire Size Calculator</h1><p>Estimate minimum copper conductor cross-section from current, one-way distance and allowed voltage drop.</p><div class="grid"><div><label>Current (A)<input id="amps" type="number" value="20"></label></div><div><label>One-way Distance (m)<input id="len" type="number" value="5"></label></div><div><label>System Voltage (V)<input id="volt" type="number" value="12"></label></div><div><label>Allowed Voltage Drop (%)<input id="drop" type="number" step="0.1" value="3"></label></div></div><button onclick="calc()">Calculate</button><div id="out" class="result">Enter values and calculate.</div></div></div><script>const sizes=[0.5,0.75,1,1.5,2.5,4,6,10,16,25,35,50,70,95,120];function calc(){const I=+amps.value,L=+len.value,V=+volt.value,p=+drop.value;if(!I||!L||!V||!p){out.textContent='Please enter valid values.';return}const allowed=V*p/100;const area=(2*L*I*0.0175)/allowed;const rec=sizes.find(s=>s>=area)||Math.ceil(area);out.innerHTML='<b>Calculated minimum:</b> '+area.toFixed(2)+' mm²<br><b>Recommended standard size:</b> '+rec+' mm²<br><small>For real installations, also check insulation rating, temperature, bundling and local electrical codes.</small>'}</script></body></html>
