<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Number Generator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:white;text-decoration:none;font-weight:800}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:white;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}button{width:100%;padding:12px;margin-top:14px;border:0;border-radius:10px;background:#3567f0;color:white;font-weight:800}.result{text-align:center;font-size:38px;font-weight:900;background:#eef4ff;padding:22px;border-radius:12px;margin-top:14px}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🎲 Random Number Generator</h1><div class="grid"><input id="min" type="number" value="1"><input id="max" type="number" value="100"></div><button onclick="gen()">Generate</button><div class="result" id="r">—</div></div></main><script>function gen(){let a=Math.ceil(+min.value),b=Math.floor(+max.value);r.textContent=b>=a?Math.floor(Math.random()*(b-a+1))+a:'Invalid range'}</script></body></html>
