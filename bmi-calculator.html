<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}.note{color:#64748b;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>⚖️ BMI Calculator</h1><p class="note">For general adult screening only; BMI is not a diagnosis.</p><div class="grid"><div><label>Weight (kg)</label><input id="w" type="number" value="70"></div><div><label>Height (cm)</label><input id="h" type="number" value="170"></div></div><div class="result" id="r"></div></div></main><script>function c(){let m=+h.value/100,b=+w.value/(m*m),s=b<18.5?'Underweight':b<25?'Healthy range':b<30?'Overweight':'Obesity range';r.textContent=m>0?`BMI: ${b.toFixed(1)} — ${s}`:'Enter valid height'}w.oninput=h.oninput=c;c()</script></body></html>
