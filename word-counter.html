<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word & Character Counter — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}textarea{width:100%;min-height:260px;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.s{background:#eef4ff;padding:14px;border-radius:12px;text-align:center}.s b{display:block;font-size:22px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>📝 Word & Character Counter</h1><textarea id="t" placeholder="Type or paste text here..."></textarea><div class="stats"><div class="s"><b id="words">0</b>Words</div><div class="s"><b id="chars">0</b>Characters</div><div class="s"><b id="lines">0</b>Lines</div><div class="s"><b id="read">0</b>Min read</div></div></div></main><script>t.oninput=()=>{let s=t.value.trim(),w=s?s.split(/\s+/).length:0;words.textContent=w;chars.textContent=t.value.length;lines.textContent=t.value?t.value.split(/\n/).length:0;read.textContent=w?Math.max(1,Math.ceil(w/200)):0}</script></body></html>
