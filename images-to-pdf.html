<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Images to PDF — NityaTools</title><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;padding:18px}header a{color:#fff;text-decoration:none;font-weight:800}.box{background:#fff;margin:28px 0;padding:22px;border:1px solid #e1e7ef;border-radius:18px}input,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #cbd5e1}button{background:#3567f0;color:#fff;border:0;font-weight:800}.muted{color:#64748b;font-size:13px}</style></head><body><header><div class="w"><a href="pdf-tools.html">← PDF Tools</a></div></header><main class="w"><div class="box"><h1>Images to PDF</h1><p class="muted">Select JPG, PNG or WebP images. Each image becomes one PDF page.</p><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><button id="go">Create PDF</button><div id="status" class="muted"></div><a id="down" style="display:none"><button>Download PDF</button></a></div></main><script>async function normalize(f){if(f.type==='image/jpeg'||f.type==='image/png')return {b:await f.arrayBuffer(),type:f.type};return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);c.toBlob(async b=>{URL.revokeObjectURL(u);res({b:await b.arrayBuffer(),type:'image/jpeg'})},'image/jpeg',.92)};im.onerror=rej;im.src=u})}go.onclick=async()=>{let fs=[...files.files];if(!fs.length)return alert('Choose one or more images.');try{status.textContent='Creating PDF...';let d=await PDFLib.PDFDocument.create();for(let f of fs){let n=await normalize(f),im=n.type==='image/png'?await d.embedPng(n.b):await d.embedJpg(n.b),s=im.scale(1),page=d.addPage([s.width,s.height]);page.drawImage(im,{x:0,y:0,width:s.width,height:s.height})}let blob=new Blob([await d.save()],{type:'application/pdf'}),u=URL.createObjectURL(blob);down.href=u;down.download='images.pdf';down.style.display='block';status.textContent=fs.length+' image(s) converted to PDF.'}catch(e){status.textContent='Could not create PDF from these images.'}}</script></body></html>
