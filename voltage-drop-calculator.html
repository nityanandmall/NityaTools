<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voltage Drop Calculator | NityaTools</title><meta name="description" content="Calculate DC cable voltage drop, percentage drop and power loss for copper or aluminium wire."><style>body{margin:0;font-family:system-ui;background:#f6f8fc;color:#111827}.w{width:min(760px,calc(100% - 28px));margin:auto}header{background:#071327;color:#fff;padding:18px 0}.brand{font-weight:900}.brand b{color:#ffc72c}.card{background:#fff;margin:28px 0;padding:24px;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 8px 24px #0000000d}h1{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #d1d5db;border-radius:9px;box-sizing:border-box}button{margin-top:18px;background:#3567f0;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.result{margin-top:18px;background:#eef4ff;padding:16px;border-radius:12px;line-height:1.7}.back{color:#3567f0;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="w brand">NITYA <b>TOOLS</b></div></header><main class="w"><div class="card"><a class="back" href="index.html">← Back to tools</a><h1>Voltage Drop Calculator</h1><p>For 2-wire DC circuits. Enter one-way cable length.</p><div class="grid"><div><label>System Voltage (V)<input id="v" type="number" value="12" min="0"></label></div><div><label>Current (A)<input id="i" type="number" value="20" min="0"></label></div><div><label>One-way Length (m)<input id="l" type="number" value="5" min="0"></label></div><div><label>Wire Area (mm²)<input id="a" type="number" value="4" min="0.01" step="0.01"></label></div><div><label>Conductor<select id="m"><option value="0.0175">Copper</option><option value="0.0282">Aluminium</option></select></label></div></div><button onclick="calc()">Calculate</button><div class="result" id="r">Enter values and calculate.</div></div></main><script>function calc(){let V=+v.value,I=+i.value,L=+l.value,A=+a.value,rho=+m.value;if(!(V>0&&I>=0&&L>=0&&A>0)){r.textContent='Please enter valid positive values.';return}let drop=2*L*I*rho/A,pct=drop/V*100,loss=drop*I;r.innerHTML='<b>Voltage Drop:</b> '+drop.toFixed(3)+' V<br><b>Drop Percentage:</b> '+pct.toFixed(2)+'%<br><b>Load-end Voltage:</b> '+Math.max(0,V-drop).toFixed(3)+' V<br><b>Cable Power Loss:</b> '+loss.toFixed(2)+' W';}</script></body></html>
