<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Panel Calculator | NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#10203a}.w{max-width:850px;margin:auto;padding:24px}.top{background:#071327;color:#fff;padding:16px}.top a{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:22px;margin-top:24px;box-shadow:0 12px 30px #16315a12}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-size:13px;font-weight:700}input,button{width:100%;padding:12px;border:1px solid #d6deea;border-radius:10px;margin-top:6px}button{background:#3567f0;color:#fff;font-weight:800;border:0;cursor:pointer}.result{margin-top:18px;background:#fff8e8;border-radius:12px;padding:18px;font-size:18px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="w"><a href="index.html">← NITYA TOOLS</a></div></div><main class="w"><h1>☀️ Solar Panel Calculator</h1><p>Estimate solar array size from your daily energy use.</p><div class="card"><div class="grid"><label>Daily Energy Use (Wh)<input id="wh" type="number" value="3000"></label><label>Peak Sun Hours<input id="sun" type="number" step="0.1" value="5"></label><label>System Efficiency (%)<input id="eff" type="number" value="80"></label></div><button onclick="calc()" style="margin-top:14px">Calculate Solar Size</button><div id="out" class="result"></div></div></main><script>function calc(){const e=+wh.value,s=+sun.value,f=+eff.value/100;if(!(e>0&&s>0&&f>0&&f<=1)){out.textContent='Please enter valid values.';return}const watts=e/(s*f);out.textContent=`Recommended solar array ≈ ${watts.toFixed(0)} W (${(watts/1000).toFixed(2)} kW). Consider extra margin for weather and future load.`};calc()</script></body></html>
