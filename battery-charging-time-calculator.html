<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery Charging Time Calculator | NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f7f9fc;color:#111827}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 8px 24px #0f172a0d}h1{font-size:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:13px}input{width:100%;padding:12px;border:1px solid #cfd7e3;border-radius:10px;margin-top:6px;box-sizing:border-box}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#3567f0;color:white;font-weight:800}.result{margin-top:18px;padding:16px;border-radius:12px;background:#eef4ff}.back{display:inline-block;margin-bottom:15px;text-decoration:none;color:#3567f0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="index.html">← Back to NityaTools</a><div class="card"><h1>🔋 Battery Charging Time Calculator</h1><p>Estimate charging time using battery capacity, charger current and efficiency.</p><div class="grid"><div><label>Battery Capacity (Ah)<input id="ah" type="number" value="150"></label></div><div><label>Charger Current (A)<input id="amps" type="number" value="15"></label></div><div><label>Charging Efficiency (%)<input id="eff" type="number" value="85"></label></div></div><button onclick="calc()">Calculate</button><div id="out" class="result">Enter values and calculate.</div></div></div><script>function calc(){const ah=+document.getElementById('ah').value,a=+document.getElementById('amps').value,e=+document.getElementById('eff').value;if(!ah||!a||!e){out.textContent='Please enter valid values.';return}const h=ah/(a*(e/100));out.innerHTML='<b>Estimated charging time:</b> '+h.toFixed(2)+' hours<br><small>Real charging time can vary with battery chemistry, temperature and charger behavior.</small>'}</script></body></html>
