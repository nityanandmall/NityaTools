apacity (Ah)<input id="ah" type="number" value="150" min="0.01" step="any"></label></div><div><label>Charger Current (A)<input id="amps" type="number" value="15" min="0.01" step="any"></label></div><div><label>Efficiency (%)<input id="eff" type="number" value="85" min="0.01" max="100" step="any"></label></div></div><button id="go">Calculate</button><div id="out" class="result" aria-live="polite">Result: —</div></div><section class="info"><h2>Formula</h2><p>Time ≈ Battery Capacity ÷ (Charger Current × Efficiency)</p><p><a href="battery-backup-calculator.html">Battery Backup</a> · <a href="solar-battery-calculator.html">Solar Battery</a> · <a href="all-tools.html">All Tools</a></p></section></main><footer><a href="about.html">About</a><a href="privacy-policy.html">Privacy</a><a href="terms.html">Terms</a><a href="contact.html">Contact</a></footer><script src="nitya-i18n.js"></script><script>function tr(k,f=k){const L=localStorage.getItem('nt-language')||'English',d=window.NITYA_I18N_EXT?.[L]||{};return d[k]||f}function calc(){const c=+ah.value,a=+amps.value,e=+eff.value;if(!(c>0&&a>0&&e>0&&e<=100)){out.textContent=tr('Please enter valid values.');return}const h=c/(a*(e/100));out.textContent=`${tr('Result')}: ${h.toFixed(2)} h`}go.onclick=calc;[ah,amps,eff].forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
