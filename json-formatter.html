<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter & Validator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}textarea{width:100%;min-height:220px;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-family:monospace}.buttons{display:flex;gap:9px;margin:12px 0}button{padding:10px 16px;border:0;border-radius:9px;background:#3567f0;color:#fff;font-weight:800}.msg{font-weight:700}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>{ } JSON Formatter & Validator</h1><textarea id="t" placeholder='{"name":"NityaTools"}'></textarea><div class="buttons"><button onclick="fmt(2)">Format</button><button onclick="fmt(0)">Minify</button></div><div class="msg" id="msg"></div></div></main><script>function fmt(n){try{let o=JSON.parse(t.value);t.value=JSON.stringify(o,null,n);msg.textContent='✓ Valid JSON'}catch(e){msg.textContent='✕ Invalid JSON: '+e.message}}</script></body></html>
