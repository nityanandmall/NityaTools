<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GST Calculator India — NityaTools</title><meta name="description" content="Calculate GST amount, inclusive price and exclusive price for common Indian GST rates."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:780px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800;line-height:1.8}.note{font-size:13px;color:#64748b}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🇮🇳 GST Calculator</h1><div class="grid"><div><label>Amount</label><input id="amt" type="number" value="1000" min="0" step="0.01"></div><div><label>GST Rate</label><select id="rate"><option>0</option><option>5</option><option>12</option><option selected>18</option><option>28</option></select></div><div><label>Amount Type</label><select id="mode"><option value="add">Add GST (exclusive amount)</option><option value="remove">Remove GST (inclusive amount)</option></select></div></div><div class="result" id="r"></div><p class="note">For quick estimation only. Actual GST treatment depends on the applicable product/service classification and tax rules.</p></div></main><script>function c(){let a=+amt.value,g=+rate.value/100;if(a<0)return;r.innerHTML=mode.value==='add'?`Base amount: ${a.toFixed(2)}<br>GST: ${(a*g).toFixed(2)}<br>Total: ${(a*(1+g)).toFixed(2)}`:`Inclusive amount: ${a.toFixed(2)}<br>Base amount: ${(a/(1+g)).toFixed(2)}<br>GST included: ${(a-a/(1+g)).toFixed(2)}`}document.querySelectorAll('input,select').forEach(e=>e.oninput=c);c()</script></body></html>
