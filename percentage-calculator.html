<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}.result{background:#eef4ff;padding:16px;border-radius:12px;font-weight:800;margin-top:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🧮 Percentage Calculator</h1><h3>What is X% of Y?</h3><div class="row"><input id="p" type="number" value="20" placeholder="Percent"><input id="n" type="number" value="500" placeholder="Number"></div><div class="result" id="r1"></div><h3>X is what percent of Y?</h3><div class="row"><input id="x" type="number" value="50"><input id="y" type="number" value="200"></div><div class="result" id="r2"></div><h3>Percentage change</h3><div class="row"><input id="old" type="number" value="100"><input id="nw" type="number" value="125"></div><div class="result" id="r3"></div></div></main><script>function c(){r1.textContent=`Result: ${(+p.value/100*+n.value).toFixed(4).replace(/\.0+$/,'')}`;r2.textContent=+y.value?`Result: ${(+x.value/+y.value*100).toFixed(2)}%`:'Enter a non-zero second value';r3.textContent=+old.value?`Change: ${((+nw.value-+old.value)/Math.abs(+old.value)*100).toFixed(2)}%`:'Enter a non-zero old value'}document.querySelectorAll('input').forEach(e=>e.oninput=c);c()</script></body></html>
