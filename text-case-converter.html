<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Case Converter — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:18px;border:1px solid #e5e7eb}textarea{width:100%;min-height:230px;box-sizing:border-box;padding:14px;border:1px solid #cbd5e1;border-radius:12px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{padding:10px 13px;border:0;border-radius:9px;background:#3567f0;color:white;font-weight:700}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🔤 Text Case Converter</h1><textarea id="t" placeholder="Paste text..."></textarea><div class="buttons"><button onclick="t.value=t.value.toUpperCase()">UPPERCASE</button><button onclick="t.value=t.value.toLowerCase()">lowercase</button><button onclick="titleCase()">Title Case</button><button onclick="sentence()">Sentence case</button><button onclick="navigator.clipboard.writeText(t.value)">Copy</button></div></div></main><script>function titleCase(){t.value=t.value.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase())}function sentence(){let s=t.value.toLowerCase();t.value=s.replace(/(^\s*\w|[.!?]\s+\w)/g,x=>x.toUpperCase())}</script></body></html>
