<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}label{font-weight:700;font-size:13px}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:10px}.result{background:#eef4ff;padding:18px;border-radius:12px;font-size:18px;font-weight:800}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🎂 Age Calculator</h1><label>Date of Birth</label><input id="dob" type="date"><label>Age on Date</label><input id="on" type="date"><div class="result" id="res">Select your date of birth.</div></div></main><script>const now=new Date();on.value=now.toISOString().slice(0,10);function calc(){if(!dob.value||!on.value)return;let a=new Date(dob.value+'T00:00'),b=new Date(on.value+'T00:00');if(b<a){res.textContent='Age-on date must be after birth date.';return}let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}const days=Math.floor((b-a)/86400000);res.textContent=`${y} years, ${m} months, ${d} days • ${days.toLocaleString()} total days`}dob.onchange=on.onchange=calc</script></body></html>
