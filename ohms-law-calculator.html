<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohm's Law Calculator — NityaTools</title><meta name="description" content="Calculate voltage, current, resistance and power with Ohm's Law."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.wrap{max-width:820px;margin:auto;padding:24px}.top{background:#071327;color:#fff;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#3567f0;color:#fff;font-weight:800}.result{margin-top:18px;background:#eef4ff;border-radius:12px;padding:18px}.note{font-size:13px;color:#64748b}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>⚡ Ohm's Law Calculator</h1><p class="note">Enter any two values among voltage, current and resistance. Leave the third blank.</p><div class="grid"><div><label>Voltage (V)</label><input id="v" type="number" step="any"></div><div><label>Current (A)</label><input id="i" type="number" step="any"></div><div><label>Resistance (Ω)</label><input id="r" type="number" step="any"></div></div><button onclick="calc()">Calculate</button><div class="result" id="out">Result: —</div></div></main><script>function calc(){let v=parseFloat(document.getElementById('v').value),i=parseFloat(document.getElementById('i').value),r=parseFloat(document.getElementById('r').value);const n=[v,i,r].filter(Number.isFinite).length,o=document.getElementById('out');if(n!==2){o.textContent='Please enter exactly two values.';return}if(!Number.isFinite(v))v=i*r;if(!Number.isFinite(i))i=v/r;if(!Number.isFinite(r))r=v/i;const p=v*i;o.innerHTML=`Voltage: <b>${v.toFixed(4)} V</b><br>Current: <b>${i.toFixed(4)} A</b><br>Resistance: <b>${r.toFixed(4)} Ω</b><br>Power: <b>${p.toFixed(4)} W</b>`}</script></body></html>
