eturn}const p=v*i;o.innerHTML=`${t('Voltage')}: <b>${v.toFixed(4)} V</b><br>${t('Current')}: <b>${i.toFixed(4)} A</b><br>${t('Resistance')}: <b>${r.toFixed(4)} Ω</b><br>${t('Power')}: <b>${p.toFixed(4)} W</b>`}document.getElementById('btn').onclick=calc;</script></body></html>
