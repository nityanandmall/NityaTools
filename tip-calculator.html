<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Calculator — NityaTools</title><meta name="description" content="Free tip calculator to calculate tip amount, total bill and per-person split in any currency."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 10px 30px #0f172a0d}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800;line-height:1.8}.note{color:#64748b;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🍽️ Tip Calculator</h1><p class="note">Works with any currency. Enter the bill, tip percentage and number of people.</p><div class="grid"><div><label>Bill Amount</label><input id="bill" type="number" value="100" min="0" step="0.01"></div><div><label>Tip (%)</label><input id="tip" type="number" value="15" min="0" step="0.1"></div><div><label>People</label><input id="people" type="number" value="1" min="1" step="1"></div></div><div class="result" id="r"></div></div></main><script>function c(){let b=+bill.value,t=+tip.value,p=Math.max(1,Math.floor(+people.value||1));if(b<0||t<0){r.textContent='Please enter valid values.';return}let ta=b*t/100,total=b+ta;r.innerHTML=`Tip amount: ${ta.toFixed(2)}<br>Total bill: ${total.toFixed(2)}<br>Per person: ${(total/p).toFixed(2)}`}document.querySelectorAll('input').forEach(e=>e.oninput=c);c()</script></body></html>
