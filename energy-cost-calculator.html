<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Cost Calculator — NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f6f8fc}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:13px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:18px;background:#eef4ff;padding:18px;border-radius:12px;font-weight:800}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>🔌 Energy Cost Calculator</h1><div class="grid"><div><label>Appliance Power (W)</label><input id="w" type="number" value="1000"></div><div><label>Hours per Day</label><input id="h" type="number" value="5"></div><div><label>Cost per kWh</label><input id="rate" type="number" value="0.15" step="0.01"></div><div><label>Days</label><input id="days" type="number" value="30"></div></div><div class="result" id="r"></div></div></main><script>function c(){let k=+w.value/1000*+h.value*+days.value,cost=k*+rate.value;r.textContent=`Energy: ${k.toFixed(2)} kWh • Estimated cost: ${cost.toFixed(2)}`}document.querySelectorAll('input').forEach(e=>e.oninput=c);c()</script></body></html>
