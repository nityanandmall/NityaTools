<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPI QR Generator — NityaTools</title><meta name="description" content="Create a UPI payment link and QR code for a UPI ID, payee name and optional amount."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#3567f0;color:#fff;font-weight:800}.qr{margin-top:18px;text-align:center}.qr img{max-width:260px;width:100%;border:1px solid #e5e7eb;border-radius:14px;padding:10px;background:#fff}.link{margin-top:12px;background:#eef4ff;padding:12px;border-radius:10px;word-break:break-all;font-size:13px}.note{color:#64748b;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>📱 UPI QR Generator</h1><div class="grid"><div><label>UPI ID</label><input id="pa" placeholder="name@bank"></div><div><label>Payee Name</label><input id="pn" placeholder="Name"></div><div><label>Amount (optional)</label><input id="am" type="number" min="0" step="0.01"></div><div><label>Note (optional)</label><input id="tn" placeholder="Payment"></div></div><button onclick="make()">Generate QR</button><div class="qr" id="qr"></div><div class="link" id="link">Enter a UPI ID to generate a payment link.</div><p class="note">The QR image is generated using a third-party QR rendering service. Verify payment details in your UPI app before paying.</p></div></main><script>function make(){let id=pa.value.trim();if(!id){link.textContent='Please enter a UPI ID.';qr.innerHTML='';return}let u='upi://pay?pa='+encodeURIComponent(id);if(pn.value.trim())u+='&pn='+encodeURIComponent(pn.value.trim());if(am.value)u+='&am='+encodeURIComponent(am.value)+'&cu=INR';if(tn.value.trim())u+='&tn='+encodeURIComponent(tn.value.trim());link.textContent=u;qr.innerHTML='<img alt="UPI QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(u)+'">'}</script></body></html>
