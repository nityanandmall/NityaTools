<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inverter Size Calculator | NityaTools</title><style>body{font-family:system-ui;margin:0;background:#f7f9fc;color:#111827}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 8px 24px #0f172a0d}h1{font-size:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:13px}input{width:100%;padding:12px;border:1px solid #cfd7e3;border-radius:10px;margin-top:6px;box-sizing:border-box}button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#3567f0;color:white;font-weight:800}.result{margin-top:18px;padding:16px;border-radius:12px;background:#eef4ff}.back{display:inline-block;margin-bottom:15px;text-decoration:none;color:#3567f0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="index.html">← Back to NityaTools</a><div class="card"><h1>🔌 Inverter Size Calculator</h1><p>Estimate the inverter VA rating you should choose for your total load.</p><div class="grid"><div><label>Total Load (Watts)<input id="load" type="number" value="800"></label></div><div><label>Power Factor<input id="pf" type="number" step="0.01" value="0.8"></label></div><div><label>Safety Margin (%)<input id="margin" type="number" value="25"></label></div></div><button onclick="calc()">Calculate</button><div id="out" class="result">Enter your load and calculate.</div></div></div><script>function calc(){const load=+document.getElementById('load').value,pf=+document.getElementById('pf').value,m=+document.getElementById('margin').value;if(!load||!pf){out.textContent='Please enter valid values.';return}const va=load/pf*(1+m/100);out.innerHTML='<b>Recommended minimum inverter:</b> '+Math.ceil(va)+' VA<br><small>Choose the next common size above this value.</small>'}</script></body></html>
