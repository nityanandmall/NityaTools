<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter — NityaTools</title><meta name="description" content="Free global unit converter for length, weight, temperature, area, volume, speed, pressure, energy and data."><style>body{font-family:system-ui;margin:0;background:#f6f8fc;color:#111827}.top{background:#071327;padding:16px 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 10px 30px #0f172a0d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;box-sizing:border-box}.result{margin-top:18px;background:#eef4ff;border-radius:12px;padding:18px;font-size:20px;font-weight:800}.note{color:#64748b;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><a href="index.html">← NITYA TOOLS</a></div><main class="wrap"><div class="card"><h1>📏 Global Unit Converter</h1><p class="note">Convert common units instantly. More categories can be added without changing the page.</p><div class="grid"><div><label>Category</label><select id="cat"></select></div><div><label>Value</label><input id="val" type="number" value="1"></div><div><label>From</label><select id="from"></select></div><div><label>To</label><select id="to"></select></div></div><div class="result" id="result">—</div></div></main><script>const D={Length:{Meter:1,Kilometer:1000,Centimeter:.01,Millimeter:.001,Mile:1609.344,Yard:.9144,Foot:.3048,Inch:.0254},Weight:{Kilogram:1,Gram:.001,Milligram:.000001,Pound:.45359237,Ounce:.028349523},Area:{'Square Meter':1,'Square Kilometer':1e6,'Square Foot':.09290304,Acre:4046.8564224,Hectare:10000},Volume:{Liter:1,Milliliter:.001,'US Gallon':3.785411784,'US Cup':.2365882365,'Cubic Meter':1000},Speed:{'m/s':1,'km/h':.2777777778,mph:.44704,knot:.514444},Pressure:{Pascal:1,kPa:1000,bar:100000,psi:6894.757293,atm:101325},Energy:{Joule:1,kJ:1000,kWh:3600000,Wh:3600,calorie:4.184},Data:{Byte:1,Kilobyte:1024,Megabyte:1048576,Gigabyte:1073741824,Terabyte:1099511627776},Temperature:{Celsius:1,Fahrenheit:1,Kelvin:1}};Object.keys(D).forEach(x=>cat.add(new Option(x,x)));function fill(){from.innerHTML=to.innerHTML='';Object.keys(D[cat.value]).forEach(x=>{from.add(new Option(x,x));to.add(new Option(x,x))});if(to.options.length>1)to.selectedIndex=1;calc()}function calc(){let v=+val.value,a=from.value,b=to.value,r;if(cat.value==='Temperature'){let c=a==='Celsius'?v:a==='Fahrenheit'?(v-32)*5/9:v-273.15;r=b==='Celsius'?c:b==='Fahrenheit'?c*9/5+32:c+273.15}else r=v*D[cat.value][a]/D[cat.value][b];result.textContent=`${v} ${a} = ${Number(r.toPrecision(10))} ${b}`}cat.onchange=fill;val.oninput=calc;from.onchange=calc;to.onchange=calc;fill()</script></body></html>
